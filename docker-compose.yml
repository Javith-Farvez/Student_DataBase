version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vsb_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: vsb_smartcampus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vsb_smartcampus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vsb_backend_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VSB SmartCampus AI Enterprise ERP
      - DATABASE_URL=postgresql://postgres:postgrespassword2026@postgres:5432/vsb_smartcampus_db
      - SECRET_KEY=vsb-engineering-college-karur-secure-jwt-key-2026
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vsb_frontend_app
    ports:
      - "80:80"
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  uploads_data:
