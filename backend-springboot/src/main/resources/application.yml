server:
  port: 8080

spring:
  application:
    name: vsb-erp-backend
  datasource:
    url: jdbc:mysql://localhost:3306/vsb_erp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

# OpenAPI / Swagger Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# JWT & Security Configuration
app:
  jwt:
    secret: 9a6f8b2c4e71035d8a9e2f4b1c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b
    expiration-ms: 86400000 # 24 Hours
    remember-me-expiration-ms: 604800000 # 7 Days
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174"
  upload:
    dir: ./uploads/photos
    max-size-bytes: 5242880 # 5 MB

logging:
  level:
    com.vsb.erp: DEBUG
    org.springframework.security: WARN
